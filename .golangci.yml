version: "2"
run:
  # No network during a lint run; a missing dep is an error, not a download.
  modules-download-mode: readonly
linters:
  enable:
    - bodyclose
    - dogsled
    - dupl
    - errorlint
    - exhaustive
    - gochecknoinits
    - gocritic
    - gosec
    - misspell
    - nakedret
    - nilerr
    - noctx
    - predeclared
    - revive
    - unconvert
    - unparam
    - whitespace
  settings:
    dupl:
      threshold: 150
    errcheck:
      check-type-assertions: true
      exclude-functions:
        - io.Copy
        - io.ReadAll
        - (io.ReadCloser).Close
        - (*encoding/json.Encoder).Encode
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    exhaustive:
      default-signifies-exhaustive: true
    gocritic:
      disabled-checks:
        - hugeParam
        - rangeValCopy
        - ifElseChain
        - elseif
        - appendCombine
        - commentedOutCode
      enabled-tags:
        - diagnostic
        - performance
    gosec:
      excludes:
        - G104
        - G115
        - G304
    govet:
      disable:
        - fieldalignment
        - shadow
      enable-all: true
    misspell:
      locale: US
    nakedret:
      max-func-lines: 30
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
          disabled: true
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
          disabled: true
        - name: var-declaration
        - name: var-naming
    unparam:
      check-exported: false
  exclusions:
    generated: lax
    rules:
      - linters:
          - dupl
          - errcheck
          - gosec
          - govet
          - unparam
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  # No goimports: gofmt covers the formatting and gci the grouping, while its
  # own import resolution matches on package name and picks wrong major
  # versions. gopls adds imports - see AGENTS.md.
  enable:
    - gofmt
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/lxc/incus-compose)
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
