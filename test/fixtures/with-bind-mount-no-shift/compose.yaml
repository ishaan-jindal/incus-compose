services:
  web:
    image: docker.io/library/caddy:2-alpine
    x-incus:
      limits.cpu: 1
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - type: bind
        source: ./html
        target: /usr/share/caddy
        read_only: true
        x-incus:
          security.shifted: "false"

configs:
  caddyfile:
    file: ./Caddyfile
