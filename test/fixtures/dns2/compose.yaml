services:
  service-db2:
    image: docker.io/nginxinc/nginx-unprivileged:alpine
    container_name: my-db2
    environment:
      NGINX_WORKER_PROCESSES: 1
    x-incus:
      limits.cpu: 1
    networks:
      default:
        aliases:
          - db2.mydomain.lan

networks:
  default:
    external: true
    x-incus-compose:
      network: dns-default
