x-incus-compose:
  healthd:
    external: true

x-incus:
  # https://linuxcontainers.org/incus/docs/main/reference/instance_options/#instance-options-limits-cpu-container
  limits.cpu: "6" # +2 for healthd
  limits.memory: 2305MB # +256 for healthd, +1 MiB for calc.
  limits.virtual-machines: 0

services:
  web:
    image: docker.io/alpine:edge
    deploy:
      replicas: 4
    x-incus:
      limits.cpu: "1"
      limits.memory: 512MB
    restart: unless-stopped
