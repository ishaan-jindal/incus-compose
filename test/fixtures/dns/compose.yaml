services:
  service-db:
    image: docker.io/nginxinc/nginx-unprivileged:alpine
    container_name: my-db
    environment:
      NGINX_WORKER_PROCESSES: 1
    x-incus:
      limits.cpu: 1
    networks:
      default:
        aliases:
          - db.mydomain.lan

  dev:
    image: docker.io/alpine:edge

