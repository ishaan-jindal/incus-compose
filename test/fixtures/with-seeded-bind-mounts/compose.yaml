name: with-seeded-bind-mounts

services:
  file-web:
    image: docker.io/library/busybox:glibc
    command: ["-c", "httpd -f -v -p 8080 -h /www"]
    x-incus:
      limits.cpu: 1
    volumes:
      - type: bind
        source: ./file.html
        target: /www/index.html
        read_only: true
        x-incus-compose:
          seed: true

  dir-web:
    image: docker.io/library/busybox:glibc
    command: ["-c", "httpd -f -v -p 8080 -h /www"]
    x-incus:
      limits.cpu: 1
    volumes:
      - type: bind
        source: ./html
        target: /www
        read_only: true
        x-incus-compose:
          seed: true
