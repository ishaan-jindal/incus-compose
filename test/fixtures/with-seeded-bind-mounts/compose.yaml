name: with-seeded-bind-mounts

services:
  file-web:
    image: docker.io/library/caddy:2-alpine
    x-incus:
      limits.cpu: 1
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - type: bind
        source: ./file.html
        target: /usr/share/caddy/index.html
        read_only: true
        x-incus-compose:
          seed: true

  dir-web:
    image: docker.io/library/caddy:2-alpine
    x-incus:
      limits.cpu: 1
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - type: bind
        source: ./html
        target: /usr/share/caddy
        read_only: true
        x-incus-compose:
          seed: true

configs:
  caddyfile:
    file: ./Caddyfile
