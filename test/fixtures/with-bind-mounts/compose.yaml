name: with-bind-mounts

services:
  file-web:
    image: docker.io/library/busybox:glibc
    entrypoint: ["httpd", "-f", "-v", "-p", "8080", "-h", "/www"]
    x-incus:
      limits.cpu: 1
    volumes:
      - ./file.html:/www/index.html:ro

  dir-web:
    image: docker.io/library/busybox:glibc
    entrypoint: ["httpd", "-f", "-v", "-p", "8080", "-h", "/www"]
    x-incus:
      limits.cpu: 1
    volumes:
      - ./html:/www:ro
