name: with-bind-mounts

services:
  file-web:
    image: docker.io/library/caddy:2-alpine
    x-incus:
      limits.cpu: 1
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - ./file.html:/usr/share/caddy/index.html:ro

  dir-web:
    image: docker.io/library/caddy:2-alpine
    x-incus:
      limits.cpu: 1
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - ./html:/usr/share/caddy:ro

configs:
  caddyfile:
    file: ./Caddyfile
