name: healthd-debug

# https://docs.docker.com/compose/how-tos/startup-order/
services:
  web:
    image: docker.io/alpine:edge
    x-incus:
      limits.cpu: 1
    restart: unless-stopped

  web-restart:
    image: docker.io/alpine:edge
    x-incus:
      limits.cpu: 1
    restart: always

  web-always:
    image: docker.io/alpine:edge
    x-incus:
      limits.cpu: 1
    restart: always

  web-on-failure:
    image: docker.io/alpine:edge
    x-incus:
      limits.cpu: 1
    restart: on-failure

