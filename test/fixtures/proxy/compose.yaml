services:
  frontend:
    image: docker.io/library/caddy:2-alpine
    restart: unless-stopped
    x-incus:
      limits.cpu: 1
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    depends_on:
      backend1:
        condition: service_healthy
      backend2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080"]
      interval: 5s
      timeout: 5s
      retries: 3

  backend1:
    image: docker.io/library/caddy:2-alpine
    restart: unless-stopped
    x-incus:
      limits.cpu: 1
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080"]
      interval: 5s
      timeout: 5s
      retries: 3

  backend2:
    image: docker.io/library/caddy:2-alpine
    restart: unless-stopped
    x-incus:
      limits.cpu: 1
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080"]
      interval: 5s
      timeout: 5s
      retries: 3

configs:
  caddyfile:
    file: ./Caddyfile
