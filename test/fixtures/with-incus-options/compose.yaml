services:
  web:
    image: docker.io/nginx:alpine
    environment:
      NGINX_ENTRYPOINT_WORKER_PROCESSES_AUTOTUNE: 1
    dns:
      - 8.8.8.8
    x-incus:
      limits.memory: 1024MB
      limits.cpu: "2"
      security.nesting: "false"
      oci.dns.nameservers: "9.9.9.9"

  database:
    image: docker.io/nginx:alpine
    environment:
      NGINX_ENTRYPOINT_WORKER_PROCESSES_AUTOTUNE: 1
    x-incus:
      limits.memory: 1GB
      limits.cpu: "4"
