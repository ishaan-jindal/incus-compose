services:
  app:
    image: docker.io/library/busybox:glibc
    configs:
      - app_config
      - db_config
      - source: nginx_config
        target: /etc/nginx/nginx.conf
        uid: "101"
        gid: "101"
        mode: 0o640
      - source: image_override
        target: /etc/nsswitch.conf

configs:
  app_config:
    file: ./app_config.txt
  db_config:
    content: |
      DB_HOST=localhost
      DB_PORT=5432
  nginx_config:
    environment: NGINX_CONFIG
  # Targets a path the busybox image already ships, so it only lands if
  # configs overwrite image files.
  image_override:
    content: |
      overwrote-the-image-file
